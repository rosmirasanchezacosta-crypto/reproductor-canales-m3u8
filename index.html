<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KikeFlix Player PRO - TV Edition</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<style>
html, body { 
    margin: 0; 
    padding: 0; 
    background: black; 
    height: 100%; 
    overflow: hidden; 
    font-family: sans-serif; 
}
#player { 
    position: relative; 
    width: 100%; 
    height: 100vh; 
    background: black; 
}
.video-wrapper { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; 
    height: 100%; 
    display: none; 
}
video, iframe { 
    width: 100%; 
    height: 100%; 
    object-fit: contain; 
    background: black; 
    border: none; 
    position: absolute; 
    top: 0; 
    left: 0; 
}

/* Video de Intro */
#videoIntro {
    z-index: 50;
    transition: opacity 0.5s ease-in-out;
    opacity: 1;
}
#videoIntro.fade-out {
    opacity: 0;
    pointer-events: none;
}

/* Cortina Negra */
#blackScreen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000000;
    z-index: 40;
    display: none;
    transition: opacity 0.4s ease-in-out;
    opacity: 1;
}
#blackScreen.fade-out {
    opacity: 0;
    pointer-events: none;
}

#bloqueo-flecha { 
    position: absolute; 
    top: 0; right: 0; 
    width: 180px; height: 60px; 
    z-index: 1000; 
    display: none; 
}

/* ============================================================
   CONTROLES (adaptados para TV con foco visible)
   ============================================================ */
.controls { 
    position: absolute; 
    bottom: 0; 
    width: 100%; 
    padding: 15px; 
    box-sizing: border-box; 
    background: linear-gradient(to top, rgba(0,0,0,0.92), transparent); 
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.3s; 
    z-index: 10; 
}
.controls.show { 
    opacity: 1; 
    pointer-events: auto;
}

/* Botones ahora son <button> reales (enfocables por D-PAD) */
.btn { 
    color: white !important; 
    font-size: 16px; 
    cursor: pointer; 
    margin-right: 12px; 
    text-shadow: 0 0 5px rgba(142, 68, 173, 0.8); 
    outline: none; 
    -webkit-tap-highlight-color: transparent !important; 
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    user-select: none; 
    transition: color 0.1s ease, background 0.1s ease, transform 0.1s ease, box-shadow 0.15s ease;
    border-radius: 8px;
    height: 36px;
    background: transparent;
    border: 2px solid transparent;
    padding: 0 8px;
    font-family: inherit;
}
.btn:hover, .btn:active { 
    color: #bc13fe !important; 
    text-shadow: 0 0 10px #bc13fe;
    background: rgba(188,19,254,0.1);
}
/* FOCO VISIBLE PARA D-PAD (púrpura brillante) */
.btn:focus,
.btn.tv-focused {
    color: #ffffff !important;
    background: rgba(188, 19, 254, 0.35) !important;
    border-color: #bc13fe !important;
    box-shadow: 0 0 20px rgba(188, 19, 254, 0.9), inset 0 0 10px rgba(188, 19, 254, 0.3) !important;
    transform: scale(1.1);
    outline: none;
}
.btn.paused-frame {
    border: 1px solid rgba(188, 19, 254, 0.7);
    box-shadow: 0 0 12px rgba(188, 19, 254, 0.45);
    background: rgba(142, 68, 173, 0.12);
}
.progress { 
    width: 100%; 
    height: 5px; 
    background: rgba(255,255,255,0.15); 
    cursor: pointer; 
    margin-bottom: 10px; 
    border-radius: 3px; 
    overflow: hidden; 
    position: relative;
    outline: none;
    transition: height 0.15s ease;
}
.progress:hover,
.progress:focus,
.progress.tv-focused { 
    height: 10px; 
}
.progress:focus,
.progress.tv-focused {
    box-shadow: 0 0 15px rgba(188, 19, 254, 0.8);
}
.progress-bar { 
    height: 100%; 
    width: 0%; 
    background: linear-gradient(90deg, #8e44ad, #bc13fe); 
    box-shadow: 0 0 10px #bc13fe; 
    transition: width 0.1s linear; 
}
.progress-buffer {
    position: absolute;
    height: 100%;
    top: 0; left: 0;
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
}
.center-play { 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%) scale(1); 
    width: 80px; height: 80px; 
    border-radius: 50%; 
    background: rgba(142, 68, 173, 0.35); 
    border: 2px solid #bc13fe; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    transition: 0.3s; 
    z-index: 5; 
    box-shadow: 0 0 25px rgba(188, 19, 254, 0.5);
    opacity: 0;
    pointer-events: none;
    outline: none;
}
.center-play.visible {
    opacity: 1;
    pointer-events: auto;
}
.center-play:hover,
.center-play:focus,
.center-play.tv-focused {
    background: rgba(142, 68, 173, 0.75) !important;
    box-shadow: 0 0 45px rgba(188, 19, 254, 1) !important;
    transform: translate(-50%, -50%) scale(1.15) !important;
}
.center-play::before { 
    content: ''; 
    margin-left: 5px; 
    border-left: 25px solid white; 
    border-top: 15px solid transparent; 
    border-bottom: 15px solid transparent; 
}

/* ============================================================
   OVERLAY DE ENTRADA (con foco D-PAD)
   ============================================================ */
#overlay { 
    position: absolute; 
    width: 100%; height: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background: #000; 
    z-index: 2000; 
}
#btn-entrar { 
    width: 90px; height: 90px; 
    cursor: pointer; 
    background: linear-gradient(135deg, #8e44ad, #bc13fe); 
    color: white; 
    border: none; 
    border-radius: 50%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    transition: transform 0.2s, box-shadow 0.2s; 
    box-shadow: 0 0 25px rgba(188,19,254,0.6);
    outline: none;
}
#btn-entrar:hover,
#btn-entrar:focus,
#btn-entrar.tv-focused { 
    transform: scale(1.15); 
    box-shadow: 0 0 55px rgba(188,19,254,1), 0 0 100px rgba(188,19,254,0.5);
    outline: 4px solid rgba(255,255,255,0.7);
    outline-offset: 8px;
}
.play-icon { 
    width: 0; height: 0; 
    border-top: 22px solid transparent; 
    border-bottom: 22px solid transparent; 
    border-left: 38px solid white; 
    margin-left: 8px; 
}

/* Botón de publicidad */
#adBtn {
    position: absolute;
    bottom: 80px;
    right: 20px;
    z-index: 2020;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    font-family: inherit;
    border: none;
    outline: none;
    user-select: none;
    transition: all 0.25s ease-in-out;
}
#adBtn.ad-counting {
    background: rgba(8, 0, 20, 0.88);
    color: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(188, 19, 254, 0.4);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 12px rgba(188, 19, 254, 0.25);
    cursor: default;
    pointer-events: none;
    backdrop-filter: blur(8px);
}
#adBtn.ad-skippable {
    background: linear-gradient(135deg, #8e44ad, #bc13fe);
    color: #ffffff;
    cursor: pointer;
    pointer-events: auto;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 22px rgba(188, 19, 254, 0.65), 0 4px 15px rgba(0, 0, 0, 0.6);
    animation: adPulse 2s infinite ease-in-out;
}
#adBtn.ad-skippable:hover,
#adBtn.ad-skippable:focus,
#adBtn.ad-skippable.tv-focused {
    transform: scale(1.1);
    background: linear-gradient(135deg, #9b59b6, #c72ffd);
    box-shadow: 0 0 40px rgba(188, 19, 254, 1), 0 6px 20px rgba(0, 0, 0, 0.7);
    outline: 3px solid rgba(255,255,255,0.8);
    outline-offset: 4px;
}
#adBtn.ad-skippable:active {
    transform: scale(0.97);
}
@keyframes adPulse {
    0%, 100% { box-shadow: 0 0 18px rgba(188, 19, 254, 0.5); }
    50% { box-shadow: 0 0 28px rgba(188, 19, 254, 0.85); }
}
/* ============================================================
   CONTROL DE VOLUMEN
   ============================================================ */
.volume-container {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-right: 12px;
}
.volume-slider-wrapper {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 125px;
    background: rgba(10, 0, 22, 0.92);
    border: 1px solid rgba(188, 19, 254, 0.45);
    border-radius: 20px;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(188, 19, 254, 0.3);
    backdrop-filter: blur(8px);
    z-index: 30;
    padding: 10px 0;
    box-sizing: border-box;
}

.volume-slider-wrapper::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    height: 15px;
}

.volume-container:hover .volume-slider-wrapper,
.volume-container.active .volume-slider-wrapper {
    display: flex;
}

#volumeSlider {
    -webkit-appearance: none;
    appearance: none;
    writing-mode: bt-lr;
    -webkit-appearance: slider-vertical;
    width: 6px;
    height: 100px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    margin: 0;
    padding: 0;
}

@supports not (-webkit-appearance: slider-vertical) {
    #volumeSlider {
        transform: rotate(-90deg);
        width: 100px;
        height: 6px;
    }
}

#volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    background: #ffffff;
    border: 2px solid #bc13fe;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(188, 19, 254, 0.9);
    transition: transform 0.15s ease;
}

#volumeSlider::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    background: #bc13fe;
    border-color: #ffffff;
}

#volumeSlider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background: #ffffff;
    border: 2px solid #bc13fe;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(188, 19, 254, 0.9);
}

/* ============================================================
   MENÚ DE AJUSTES (con navegación D-PAD)
   ============================================================ */
.settings-container {
    position: relative;
    display: inline-block;
}
.settings-menu {
    position: absolute;
    bottom: calc(100% + 12px);
    right: 0;
    background: rgba(8,0,18,0.94);
    border: 1px solid rgba(188,19,254,0.4);
    border-radius: 12px;
    padding: 0;
    min-width: 250px;
    display: none;
    color: white;
    font-size: 13px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(188,19,254,0.2), 0 8px 32px rgba(0,0,0,0.6);
    z-index: 20;
    overflow: hidden;
    max-height: 60vh;
    overflow-y: auto;
}
.settings-container.active .settings-menu {
    display: block;
}
.settings-header {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    color: #bc13fe;
    border-bottom: 1px solid rgba(188,19,254,0.2);
    display: flex;
    align-items: center;
    gap: 8px;
}
.settings-header.back-header {
    cursor: pointer;
    transition: background 0.15s;
    outline: none;
}
.settings-header.back-header:hover,
.settings-header.back-header:focus,
.settings-header.back-header.tv-focused {
    background: rgba(188,19,254,0.25);
    color: #ffffff;
}
.settings-item {
    padding: 11px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    outline: none;
}
.settings-item:hover {
    background: rgba(188,19,254,0.1);
}
.settings-item.selected {
    background: rgba(188,19,254,0.15);
}
/* FOCO D-PAD en items del menú */
.settings-item:focus,
.settings-item.tv-focused {
    background: rgba(188, 19, 254, 0.45) !important;
    box-shadow: inset 4px 0 0 #bc13fe, 0 0 15px rgba(188, 19, 254, 0.5);
}
.settings-item .s-label {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.settings-item .s-value {
    color: #bc13fe;
    font-size: 12px;
    margin-left: 12px;
    white-space: nowrap;
    font-weight: 600;
}
.settings-item .s-check {
    color: #bc13fe;
    margin-left: 8px;
    font-size: 14px;
}
.arrow::after {
    content: '\203A';
    color: rgba(255,255,255,0.5);
    font-size: 20px;
    margin-left: 8px;
}
.divider {
    height: 1px;
    background: rgba(188,19,254,0.2);
    margin: 4px 0;
}

/* Badges e indicadores */
.lang-badge {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.75);
    color: #bc13fe;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    z-index: 6;
    display: none;
    border: 1px solid rgba(188,19,254,0.25);
}
.sub-badge {
    position: absolute;
    top: 16px; left: 100px;
    background: rgba(0,0,0,0.75);
    color: #FFD700;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    z-index: 6;
    display: none;
    border: 1px solid rgba(255,215,0,0.25);
}

.toast-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,0,20,0.88);
    color: white;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 15px;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    border: 1px solid rgba(188,19,254,0.3);
    text-align: center;
}
.toast-msg.visible {
    opacity: 1;
}

.speed-btn {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    margin-right: 12px;
    transition: color 0.1s, background 0.1s, transform 0.1s, box-shadow 0.15s;
    background: transparent;
    border: 2px solid transparent;
    font-family: inherit;
    outline: none;
}
.speed-btn:hover { color: #bc13fe; background: rgba(188,19,254,0.1); }
.speed-btn:focus,
.speed-btn.tv-focused {
    color: #ffffff !important;
    background: rgba(188, 19, 254, 0.35) !important;
    border-color: #bc13fe !important;
    box-shadow: 0 0 15px rgba(188, 19, 254, 0.8);
    transform: scale(1.1);
}

.player-logo {
    position: absolute;
    top: 18px;
    left: 20px;
    z-index: 60;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    user-select: none;
}
.player-logo img {
    height: 48px;
    max-width: 180px;
    object-fit: contain;
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.85));
}

/* ============================================================
   BOTÓN CERRAR/VOLVER (solo visible en TV)
   ============================================================ */
#btn-back-tv {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 70;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    border: 2px solid rgba(188, 19, 254, 0.5);
    color: white;
    font-size: 24px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
}
#btn-back-tv:hover,
#btn-back-tv:focus,
#btn-back-tv.tv-focused {
    background: rgba(188, 19, 254, 0.5);
    border-color: #ffffff;
    box-shadow: 0 0 25px rgba(188, 19, 254, 0.9);
    transform: scale(1.1);
}

/* ============================================================
   MODO TV (controles más grandes cuando se detecta TV)
   ============================================================ */
body.tv-mode .btn {
    font-size: 22px;
    min-width: 50px;
    height: 50px;
    padding: 0 14px;
    margin-right: 16px;
}
body.tv-mode .speed-btn {
    font-size: 16px;
    padding: 8px 14px;
}
body.tv-mode .controls {
    padding: 25px;
}
body.tv-mode .progress {
    height: 8px;
    margin-bottom: 15px;
}
body.tv-mode .progress:focus,
body.tv-mode .progress.tv-focused {
    height: 14px;
}
body.tv-mode .settings-menu {
    min-width: 320px;
    font-size: 16px;
}
body.tv-mode .settings-item {
    padding: 15px 20px;
}
body.tv-mode #currentTime,
body.tv-mode #totalTime {
    font-size: 16px !important;
}
body.tv-mode #btn-back-tv {
    display: flex;
}
body.tv-mode .center-play {
    width: 100px;
    height: 100px;
}
body.tv-mode .center-play::before {
    border-left: 32px solid white;
    border-top: 20px solid transparent;
    border-bottom: 20px solid transparent;
}

/* Diseño responsivo móvil */
@media(max-width:600px){
    .btn { font-size: 16px; min-width: 36px; height: 36px; margin-right: 8px; }
    .speed-btn { font-size: 11px; padding: 3px 6px; margin-right: 8px; }
    .controls { padding: 10px 10px 12px; }
    .progress { margin-bottom: 8px; }

    .settings-menu {
        min-width: 0;
        width: calc(100vw - 24px);
        max-width: 280px;
        font-size: 12px;
        right: 0;
        left: auto;
        max-height: 55vh;
    }
    .settings-header { padding: 10px 14px; font-size: 13px; gap: 6px; }
    .settings-item { padding: 9px 14px; }
    .settings-item .s-label { font-size: 12px; }
    .settings-item .s-value { font-size: 11px; margin-left: 8px; }
    .settings-item .s-check { font-size: 13px; }

    .volume-slider-wrapper { width: 32px; height: 100px; padding: 8px 0; }
    #volumeSlider { height: 80px; }
    .volume-container { margin-right: 8px; }

    #adBtn { bottom: 70px; right: 12px; padding: 9px 16px; font-size: 12px; }

    .toast-msg { font-size: 13px; padding: 10px 18px; }
    .center-play { width: 64px; height: 64px; }
    .center-play::before { border-left: 20px solid white; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }

    .player-logo { top: 12px; left: 12px; }
    .player-logo img { height: 34px; max-width: 120px; }
}

@media(max-width:380px){
    .btn { min-width: 32px; height: 32px; font-size: 14px; margin-right: 6px; }
    .speed-btn { font-size: 10px; padding: 2px 5px; margin-right: 6px; }
    .settings-menu { width: calc(100vw - 20px); max-width: 240px; }
    .settings-item { padding: 8px 12px; }
    .player-logo img { height: 28px; max-width: 100px; }
    .volume-slider-wrapper { width: 28px; height: 90px; }
    #volumeSlider { height: 70px; }
    #adBtn { padding: 8px 13px; font-size: 11px; bottom: 64px; right: 10px; }
    .center-play { width: 56px; height: 56px; }
    .toast-msg { font-size: 12px; padding: 9px 14px; }
}
</style>
</head>
<body oncontextmenu="return false">

<div id="player">
    <div class="player-logo">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEil2dds7gIHlc-jR_PV41bR6HiwYzt4n7ciZhiP8KlTlWXXIyZrrYzCYP1UwpK-bLTm6eI4Rpvhvaq3Z-7l5qIyR-BuJnDIi_SjWJ2dWcWS31q7zCws74ta2IAa10-ohsOXV44ts5rekRSCpfjoDAAgJcpXnFo2VXljQ2lswxjM6CkdJI1nGq_cqmuGbBg/s1600/logo300px.png" alt="Logo" referrerpolicy="no-referrer">
    </div>

    <!-- Botón de volver para TV -->
    <button id="btn-back-tv" type="button" aria-label="Volver">←</button>

    <div id="overlay"><button id="btn-entrar"><div class="play-icon"></div></button></div>
    
    <button id="adBtn" class="ad-counting" style="display: none;"><span id="adText">Publicidad · 21s</span></button>

    <div class="video-wrapper" id="wrapper-externo"><div id="bloqueo-flecha"></div><iframe id="videoFrame" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
    
    <div id="blackScreen"></div>

    <video id="videoIntro" style="display: none;" playsinline webkit-playsinline src="https://raw.githubusercontent.com/rosmirasanchezacosta-crypto/reproductor-canales-m3u8/main/intro-negra.mp4"></video>

    <video id="video" style="display: none;" playsinline></video>
    
    <button id="centerPlay" class="center-play" type="button"></button>
    <div class="lang-badge" id="langBadge"></div>
    <div class="sub-badge" id="subBadge">CC</div>
    <div class="toast-msg" id="toastMsg"></div>

    <div class="controls" id="custom-controls" style="display: none;">
        <div class="progress" id="progress" tabindex="0" role="slider" aria-label="Progreso del video"><div class="progress-buffer" id="bufferBar"></div><div class="progress-bar" id="bar"></div></div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; color: white; margin-top: 5px;">
            <div style="display: flex; align-items: center;">
                <button class="btn" id="playBtn" type="button" aria-label="Reproducir/Pausar">▶</button>
                <div class="volume-container" id="volumeContainer">
                    <button class="btn" id="muteBtn" type="button" style="margin-right: 0;" aria-label="Silenciar">🔊</button>
                    <div class="volume-slider-wrapper">
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" orient="vertical">
                    </div>
                </div>
                <span style="font-size: 12px; margin-right: 12px; opacity: 0.7;"><span id="currentTime">0:00</span> / <span id="totalTime">0:00</span></span>
            </div>
            <div style="display: flex; align-items: center;">
                <button class="speed-btn" id="speedBtn" type="button" title="Velocidad">1x</button>
                <div class="settings-container" id="settingsContainer">
                    <button class="btn" id="settingsBtn" type="button" style="margin-right: 0;" aria-label="Ajustes">⚙️</button>
                    <div class="settings-menu" id="settingsMenu"></div>
                </div>
                <button class="btn" id="pipBtn" type="button" title="Imagen en imagen" style="margin-right: 0; display: none;" aria-label="PiP">🖼</button>
                <button class="btn" id="fullscreenBtn" type="button" aria-label="Pantalla completa">⛶</button>
            </div>
        </div>
    </div>
</div>
<script>
// ============================================================
// KikeFlix Player PRO - TV Edition
// ============================================================

var video = document.getElementById("video"),
    videoIntro = document.getElementById("videoIntro"),
    blackScreen = document.getElementById("blackScreen"),
    playBtn = document.getElementById("playBtn"),
    muteBtn = document.getElementById("muteBtn"),
    fullscreenBtn = document.getElementById("fullscreenBtn"),
    centerPlay = document.getElementById("centerPlay"),
    progress = document.getElementById("progress"),
    bar = document.getElementById("bar"),
    bufferBar = document.getElementById("bufferBar"),
    controls = document.getElementById("custom-controls"),
    wrapperExterno = document.getElementById('wrapper-externo'),
    iframe = document.getElementById('videoFrame'),
    adBtn = document.getElementById('adBtn'),
    adText = document.getElementById('adText'),
    overlay = document.getElementById('overlay'),
    bloqueoFlecha = document.getElementById('bloqueo-flecha'),
    volumeSlider = document.getElementById("volumeSlider"),
    volumeContainer = document.getElementById("volumeContainer"),
    settingsContainer = document.getElementById("settingsContainer"),
    settingsMenu = document.getElementById("settingsMenu"),
    settingsBtn = document.getElementById("settingsBtn"),
    player = document.getElementById("player"),
    langBadge = document.getElementById("langBadge"),
    subBadge = document.getElementById("subBadge"),
    toastMsg = document.getElementById("toastMsg"),
    speedBtn = document.getElementById("speedBtn"),
    pipBtn = document.getElementById("pipBtn"),
    btnBackTv = document.getElementById("btn-back-tv");

// ===== DETECCIÓN DE TV =====
var isTV = false;
function detectTV() {
    var ua = navigator.userAgent.toLowerCase();
    var tvKeywords = ['tv', 'smarttv', 'googletv', 'hbbtv', 'netcast', 'tizen',
                      'webos', 'roku', 'firetv', 'aftb', 'aftm', 'aftt', 'afts',
                      'android tv', 'bravia', 'viera', 'philips', 'hisense',
                      'vidaa', 'web0s', 'large screen', 'leanback'];
    for (var i = 0; i < tvKeywords.length; i++) {
        if (ua.indexOf(tvKeywords[i]) !== -1) { isTV = true; break; }
    }
    if (!isTV && window.innerWidth >= 1200 && window.innerHeight >= 600 &&
        ('ontouchstart' in window) === false && !navigator.maxTouchPoints) {
        isTV = true;
    }
    if (isTV) {
        document.body.classList.add('tv-mode');
        if (btnBackTv) btnBackTv.style.display = 'flex';
    }
}
detectTV();

// ===== PARÁMETROS URL =====
var params = new URLSearchParams(window.location.search + window.location.hash.replace('#', '&'));

function getVideoParam() {
    var raw = window.location.search;
    if (raw.charAt(0) === '?') raw = raw.substring(1);
    var hash = window.location.hash;
    if (hash.charAt(0) === '#') hash = hash.substring(1);
    raw = raw + (raw && hash ? '&' : '') + hash;
    var idx = raw.indexOf('video=');
    if (idx === -1) return null;
    var rest = raw.substring(idx + 'video='.length);
    var known = ['ad', 'subtitle', 'audio', 'audios', 'subtitles'];
    var cutIdx = rest.length;
    for (var i = 0; i < known.length; i++) {
        var pos = rest.indexOf('&' + known[i] + '=');
        if (pos !== -1 && pos < cutIdx) cutIdx = pos;
    }
    var val = rest.substring(0, cutIdx);
    try { return decodeURIComponent(val); } catch(e) { return val; }
}

var videoUrl = getVideoParam() || "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
    adUrl = params.get("ad"),
    subUrl = params.get("subtitle"),
    audioUrl = params.get("audio");

function parseTrackList(raw) {
    if (!raw) return [];
    return raw.split(',').map(function(item) {
        var trimmed = item.trim();
        if (!trimmed) return null;
        var parts = trimmed.split(':');
        if (parts.length >= 2) {
            return { label: parts[0].trim(), url: parts.slice(1).join(':').trim() };
        }
        return { label: 'Pista', url: trimmed };
    }).filter(Boolean);
}

var parsedAudios = parseTrackList(params.get("audios"));
if (audioUrl && !parsedAudios.some(function(a) { return a.url === audioUrl; })) {
    parsedAudios.unshift({ label: 'Audio Externo', url: audioUrl });
}
var parsedSubs = parseTrackList(params.get("subtitles"));
if (subUrl && !parsedSubs.some(function(s) { return s.url === subUrl; })) {
    parsedSubs.unshift({ label: 'Subtítulo', url: subUrl });
}

var LANG_NAMES = {
    es:'Español', en:'English', pt:'Português', fr:'Français', de:'Deutsch',
    it:'Italiano', ja:'日本語', zh:'中文', ko:'한국어', ar:'العربية', ru:'Русский',
    ca:'Català', eu:'Euskera', gl:'Galego', va:'Valencià', qu:'Quechua',
    ay:'Aymara', gn:'Guaraní', nah:'Náhuatl', spa:'Español', eng:'English',
    por:'Português', fre:'Français', ger:'Deutsch', ita:'Italiano',
    und:'Original', zxx:'Sin voz', qaa:'Original',
    'es-419':'Español LatAm', 'es-MX':'Español México', 'es-AR':'Español Argentina',
    'es-CO':'Español Colombia', 'es-ES':'Español España'
};
function langName(code) {
    if (!code) return 'Original';
    return LANG_NAMES[code] || LANG_NAMES[code.split('-')[0]] || code;
}

var hlsPlayer = null, dashPlayer = null;
var playbackStarted = false;
var currentAudioIdx = -1, currentSubIdx = -1;
var availableAudio = [], availableSubs = [];
var menuPage = 'main';
var playbackRate = 1;
var SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
var externalAudioEl = null;
var lastNonZeroVolume = 1;

function tipo(u) {
    if (!u) return "vacio";
    var l = u.toLowerCase();
    if (l.includes("drive.google.com")) return "drive";
    if (l.includes(".m3u8")) return "hls";
    if (l.includes(".mpd")) return "dash";
    if (l.match(/\.(mp4|mkv|webm|avi)/i) || l.includes("/series/") || l.includes("/movie/") || l.includes("/live/")) return "mp4";
    return "embed";
}
var tipoCont = tipo(videoUrl);

var toastTimer = null;
function showToast(msg, dur) {
    dur = dur || 1500;
    toastMsg.textContent = msg;
    toastMsg.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastMsg.classList.remove('visible'); }, dur);
}

function formatTime(s) {
    if (isNaN(s)) return "0:00";
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
}

function togglePlay() {
    if (tipoCont === 'embed' || tipoCont === 'drive') return;
    if (video.paused) { video.play().catch(function(){}); }
    else { video.pause(); }
}

playBtn.onclick = togglePlay;
centerPlay.onclick = togglePlay;

video.addEventListener("play", function() {
    centerPlay.classList.remove("visible");
    playBtn.innerText = "⏸";
    playBtn.classList.add("paused-frame");
});
video.addEventListener("playing", function() {
    playbackStarted = true;
    centerPlay.classList.remove("visible");
    playBtn.innerText = "⏸";
    playBtn.classList.add("paused-frame");
    blackScreen.classList.add('fade-out');
    setTimeout(function() {
        blackScreen.style.display = 'none';
        blackScreen.classList.remove('fade-out');
    }, 400);
});
video.addEventListener("pause", function() {
    if (playbackStarted && !video.ended) centerPlay.classList.add("visible");
    else centerPlay.classList.remove("visible");
    playBtn.innerText = "▶";
    playBtn.classList.add("paused-frame");
});
video.addEventListener("ended", function() {
    centerPlay.classList.remove("visible");
    playBtn.innerText = "▶";
    playBtn.classList.add("paused-frame");
});

// ===== VOLUMEN =====
function syncVolumeVisuals(vol, isMuted) {
    if (volumeSlider) volumeSlider.value = isMuted ? '0' : String(vol);
    if (muteBtn) {
        if (isMuted || vol === 0) muteBtn.innerText = "🔇";
        else if (vol < 0.4) muteBtn.innerText = "🔈";
        else if (vol < 0.8) muteBtn.innerText = "🔉";
        else muteBtn.innerText = "🔊";
    }
}

muteBtn.onclick = function(e) {
    e.stopPropagation();
    var currentlyMuted = externalAudioEl ? externalAudioEl.muted : video.muted;
    if (!currentlyMuted) {
        if (video.volume > 0) lastNonZeroVolume = video.volume;
        video.muted = true;
        if (externalAudioEl) externalAudioEl.muted = true;
        syncVolumeVisuals(video.volume, true);
        showToast('🔇 Silenciado');
    } else {
        var restoreVol = lastNonZeroVolume > 0 ? lastNonZeroVolume : 0.7;
        video.muted = false;
        video.volume = restoreVol;
        if (externalAudioEl) { externalAudioEl.muted = false; externalAudioEl.volume = restoreVol; }
        syncVolumeVisuals(restoreVol, false);
        showToast('🔊 Volumen: ' + Math.round(restoreVol * 100) + '%');
    }
};

volumeContainer.addEventListener('click', function(e) {
    if (e.target === volumeSlider) return;
    volumeContainer.classList.toggle('active');
});

volumeSlider.oninput = function(e) {
    var v = Math.min(1, Math.max(0, parseFloat(e.target.value)));
    video.volume = v;
    video.muted = (v === 0);
    if (v > 0) lastNonZeroVolume = v;
    if (externalAudioEl) { externalAudioEl.volume = v; externalAudioEl.muted = (v === 0); }
    syncVolumeVisuals(v, v === 0);
};

fullscreenBtn.onclick = function() {
    if (!document.fullscreenElement) player.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
};

video.ontimeupdate = function() {
    if (video.duration) {
        bar.style.width = (video.currentTime / video.duration) * 100 + "%";
        document.getElementById("currentTime").innerText = formatTime(video.currentTime);
        document.getElementById("totalTime").innerText = formatTime(video.duration);
    }
};
video.onprogress = function() {
    if (video.buffered.length > 0 && video.duration) {
        var end = video.buffered.end(video.buffered.length - 1);
        bufferBar.style.width = (end / video.duration) * 100 + "%";
    }
};
progress.onclick = function(e) {
    var rect = progress.getBoundingClientRect();
    video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
};

speedBtn.onclick = function() {
    var cur = SPEEDS.indexOf(playbackRate);
    var next = (cur + 1) % SPEEDS.length;
    playbackRate = SPEEDS[next];
    video.playbackRate = playbackRate;
    if (externalAudioEl) externalAudioEl.playbackRate = playbackRate;
    speedBtn.innerText = playbackRate + 'x';
    showToast('Velocidad: ' + playbackRate + 'x');
};

if (document.pictureInPictureEnabled) pipBtn.style.display = '';
pipBtn.onclick = function() {
    try {
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else video.requestPictureInPicture();
    } catch(e) { showToast('PiP no disponible'); }
};

// ===== AUDIO EXTERNO =====
function loadExternalAudioFile() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'audio/*,.mp3,.m4a,.aac,.ogg,.wav';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var blobUrl = URL.createObjectURL(file);
        var cleanName = file.name.replace(/\.[^/.]+$/, '');
        var newIdx = availableAudio.length;
        availableAudio.push({ label: '📁 ' + cleanName, type: 'external', url: blobUrl });
        setAudioTrack(newIdx);
    };
    input.click();
}

function loadExternalAudio(url) {
    if (externalAudioEl) {
        if (externalAudioEl._cleanup) externalAudioEl._cleanup();
        externalAudioEl.pause(); externalAudioEl.remove(); externalAudioEl = null;
    }
    externalAudioEl = document.createElement('audio');
    externalAudioEl.src = url;
    externalAudioEl.volume = video.volume;
    externalAudioEl.muted = video.muted;
    externalAudioEl.playbackRate = video.playbackRate;
    externalAudioEl.currentTime = video.currentTime;
    video.muted = true;
    syncVolumeVisuals(externalAudioEl.volume, externalAudioEl.muted);
    var onPlay = function() { if (externalAudioEl) { externalAudioEl.currentTime = video.currentTime; externalAudioEl.play().catch(function(){}); } };
    var onPause = function() { if (externalAudioEl) externalAudioEl.pause(); };
    var onSeeking = function() { if (externalAudioEl) externalAudioEl.currentTime = video.currentTime; };
    var onSeeked = function() { if (externalAudioEl) externalAudioEl.currentTime = video.currentTime; };
    var onTimeUpdate = function() { if (externalAudioEl && !externalAudioEl.paused && !video.paused) { var diff = Math.abs(externalAudioEl.currentTime - video.currentTime); if (diff > 0.25) externalAudioEl.currentTime = video.currentTime; } };
    var onRateChange = function() { if (externalAudioEl) externalAudioEl.playbackRate = video.playbackRate; };
    var onWaiting = function() { if (externalAudioEl) externalAudioEl.pause(); };
    var onPlaying = function() { if (externalAudioEl && !video.paused) { externalAudioEl.currentTime = video.currentTime; externalAudioEl.play().catch(function(){}); } };
    video.addEventListener('play', onPlay);
    video.addEventListener('pause', onPause);
    video.addEventListener('seeking', onSeeking);
    video.addEventListener('seeked', onSeeked);
    video.addEventListener('timeupdate', onTimeUpdate);
    video.addEventListener('ratechange', onRateChange);
    video.addEventListener('waiting', onWaiting);
    video.addEventListener('playing', onPlaying);
    externalAudioEl._cleanup = function() {
        video.removeEventListener('play', onPlay); video.removeEventListener('pause', onPause);
        video.removeEventListener('seeking', onSeeking); video.removeEventListener('seeked', onSeeked);
        video.removeEventListener('timeupdate', onTimeUpdate); video.removeEventListener('ratechange', onRateChange);
        video.removeEventListener('waiting', onWaiting); video.removeEventListener('playing', onPlaying);
    };
    if (!video.paused) externalAudioEl.play().catch(function(){});
    showToast('🔊 Audio externo sincronizado');
}

function detectAudioTracks() {
    availableAudio = [];
    if (hlsPlayer && hlsPlayer.audioTracks && hlsPlayer.audioTracks.length > 0) {
        hlsPlayer.audioTracks.forEach(function(track, i) {
            availableAudio.push({ label: langName(track.lang || track.name) + (track.name ? ' (' + track.name + ')' : ''), lang: track.lang, type: 'hls', index: i });
        });
        if (currentAudioIdx === -1) currentAudioIdx = hlsPlayer.audioTrack;
    } else if (dashPlayer) {
        try {
            var tracks = dashPlayer.getTracksFor('audio');
            if (tracks && tracks.length > 0) {
                tracks.forEach(function(track, i) {
                    availableAudio.push({ label: langName(track.lang) + (track.label ? ' - ' + track.label : ''), lang: track.lang, type: 'dash', index: i, dashTrack: track });
                });
                if (currentAudioIdx === -1) currentAudioIdx = 0;
            }
        } catch(e) {}
    } else {
        availableAudio.push({ label: '🔊 Audio original', lang: 'original', type: 'video-original' });
        if (currentAudioIdx === -1) currentAudioIdx = 0;
        var nativeAudio = video.audioTracks;
        if (nativeAudio && nativeAudio.length > 0) {
            for (var i = 0; i < nativeAudio.length; i++) {
                availableAudio.push({ label: langName(nativeAudio[i].language), lang: nativeAudio[i].language, type: 'native', index: i });
            }
        }
    }
    parsedAudios.forEach(function(pa) {
        if (!availableAudio.some(function(a) { return a.url === pa.url; }))
            availableAudio.push({ label: '🔊 ' + pa.label, type: 'external', url: pa.url });
    });
    updateLangBadge();
}

function setAudioTrack(idx) {
    if (idx < 0 || idx >= availableAudio.length) return;
    var track = availableAudio[idx];
    currentAudioIdx = idx;
    if (track.type === 'video-original') {
        if (externalAudioEl) { if (externalAudioEl._cleanup) externalAudioEl._cleanup(); externalAudioEl.pause(); externalAudioEl.remove(); externalAudioEl = null; }
        video.muted = false; syncVolumeVisuals(video.volume, false); showToast('🔊 Audio original');
    } else if (track.type === 'hls' && hlsPlayer) {
        hlsPlayer.audioTrack = track.index; showToast('🔊 ' + track.label);
    } else if (track.type === 'dash' && dashPlayer) {
        try { dashPlayer.setCurrentTrack(track.dashTrack); showToast('🔊 ' + track.label); } catch(e) {}
    } else if (track.type === 'native') {
        var na = video.audioTracks; if (na) for (var i = 0; i < na.length; i++) na[i].enabled = (i === track.index);
        showToast('🔊 ' + track.label);
    } else if (track.type === 'external') {
        loadExternalAudio(track.url); showToast('🔊 ' + track.label);
    }
    updateLangBadge(); menuPage = 'main'; buildMenu();
}

function updateLangBadge() {
    if (availableAudio.length > 1 && currentAudioIdx >= 0) {
        langBadge.textContent = availableAudio[currentAudioIdx]?.label || '';
        langBadge.style.display = 'block';
        setTimeout(function() { langBadge.style.display = 'none'; }, 4000);
    } else langBadge.style.display = 'none';
}

// ===== SUBTÍTULOS =====
function detectSubtitleTracks() {
    availableSubs = [];
    if (hlsPlayer && hlsPlayer.subtitleTracks && hlsPlayer.subtitleTracks.length > 0) {
        hlsPlayer.subtitleTracks.forEach(function(track, i) {
            availableSubs.push({ label: langName(track.lang || track.name), lang: track.lang, type: 'hls', index: i });
        });
    } else if (dashPlayer) {
        try {
            var tracks = dashPlayer.getTracksFor('text');
            if (tracks && tracks.length > 0) tracks.forEach(function(track, i) {
                availableSubs.push({ label: langName(track.lang), lang: track.lang, type: 'dash', index: i, dashTrack: track });
            });
        } catch(e) {}
    }
    if (video.textTracks && video.textTracks.length > 0) {
        for (var i = 0; i < video.textTracks.length; i++) {
            var t = video.textTracks[i];
            if (!availableSubs.some(function(s) { return s.lang === t.language && s.type !== 'external'; }))
                availableSubs.push({ label: langName(t.language), lang: t.language, type: 'native', index: i });
        }
    }
    parsedSubs.forEach(function(ps) {
        if (!availableSubs.some(function(s) { return s.url === ps.url; }))
            availableSubs.push({ label: '💬 ' + ps.label, lang: 'ext', type: 'external-url', url: ps.url });
    });
    updateSubBadge();
}

function setSubtitleTrack(idx) {
    if (video.textTracks) for (var i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = 'hidden';
    if (hlsPlayer && hlsPlayer.subtitleTrack !== undefined) hlsPlayer.subtitleTrack = -1;
    if (dashPlayer) try { dashPlayer.setTextTrack(-1); } catch(e) {}
    currentSubIdx = idx;
    if (idx >= 0 && idx < availableSubs.length) {
        var track = availableSubs[idx];
        if (track.type === 'hls' && hlsPlayer) {
            hlsPlayer.subtitleTrack = track.index;
            setTimeout(function() { for (var i = 0; i < video.textTracks.length; i++) { var tt = video.textTracks[i]; if (tt.language === track.lang || i === track.index) tt.mode = 'showing'; } }, 500);
            showToast('💬 ' + track.label);
        } else if (track.type === 'dash' && dashPlayer) {
            try { dashPlayer.setTextTrack(track.dashTrack.index); showToast('💬 ' + track.label); } catch(e) {}
        } else if (track.type === 'native') {
            video.textTracks[track.index].mode = 'showing'; showToast('💬 ' + track.label);
        } else if (track.type === 'external-url') {
            loadExternalSubtitleUrl(track.url, track.label.replace('💬 ', '')); showToast('💬 Cargando...');
        }
    } else showToast('💬 Subtítulos OFF');
    updateSubBadge(); menuPage = 'main'; buildMenu();
}

function loadExternalSubtitle() {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.vtt,.srt,.ass,.ssa';
    input.onchange = function(e) {
        var file = e.target.files[0]; if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var text = ev.target.result;
            if (file.name.endsWith('.srt') || (text.includes('-->') && !text.startsWith('WEBVTT'))) text = srtToVtt(text);
            var blob = new Blob([text], { type: 'text/vtt' });
            addVttTrack(URL.createObjectURL(blob), file.name);
        };
        reader.readAsText(file);
    };
    input.click();
}

function loadExternalSubtitleUrl(url, label) {
    fetch(url).then(function(r) { return r.text(); }).then(function(text) {
        if (url.toLowerCase().endsWith('.srt') || (text.includes('-->') && !text.startsWith('WEBVTT'))) text = srtToVtt(text);
        var blob = new Blob([text], { type: 'text/vtt' });
        addVttTrack(URL.createObjectURL(blob), label || 'Subtítulo URL');
    }).catch(function() { addVttTrack(url, label || 'Subtítulo URL'); });
}

function addVttTrack(url, label) {
    var track = document.createElement('track');
    track.kind = 'subtitles'; track.label = label || 'Externo'; track.srclang = 'ext'; track.src = url; track.default = true;
    video.appendChild(track);
    setTimeout(function() {
        var tt = video.textTracks[video.textTracks.length - 1];
        if (tt) tt.mode = 'showing';
        availableSubs.push({ label: '📁 ' + (label || 'Externo'), lang: 'ext', type: 'external-vtt', index: video.textTracks.length - 1 });
        updateSubBadge(); buildMenu();
    }, 300);
}

function srtToVtt(srt) {
    var vtt = 'WEBVTT\n\n';
    srt.trim().split(/\n\n+/).forEach(function(block) {
        var lines = block.trim().split('\n');
        if (lines.length < 2) return;
        var timeIdx = lines[0].includes('-->') ? 0 : 1;
        var timeLine = lines[timeIdx].replace(/,/g, '.');
        var text = lines.slice(timeIdx + 1).join('\n');
        if (timeLine.includes('-->')) vtt += timeLine + '\n' + text + '\n\n';
    });
    return vtt;
}

function updateSubBadge() {
    subBadge.style.display = (currentSubIdx >= 0) ? 'block' : 'none';
    if (currentSubIdx >= 0) setTimeout(function() { subBadge.style.display = 'none'; }, 4000);
}

// ===== MENÚ DE AJUSTES =====
function buildMenu() {
    var html = '';
    if (menuPage === 'main') {
        html += '<div class="settings-header">⚙️ Configuración</div>';
        var audioLabel = (availableAudio.length > 0 && currentAudioIdx >= 0) ? availableAudio[currentAudioIdx].label : 'Original';
        html += '<div class="settings-item arrow" tabindex="0" data-page="audio"><span class="s-label">🔊 Idioma / Audio</span><span class="s-value">' + audioLabel + '</span></div>';
        var subLabel = (currentSubIdx >= 0) ? availableSubs[currentSubIdx].label : 'Desactivados';
        html += '<div class="settings-item arrow" tabindex="0" data-page="subtitle"><span class="s-label">💬 Subtítulos</span><span class="s-value">' + subLabel + '</span></div>';
        if (tipoCont === 'hls' && hlsPlayer && hlsPlayer.levels && hlsPlayer.levels.length > 1) {
            var q = hlsPlayer.currentLevel;
            var qLabel = (q >= 0 && hlsPlayer.levels[q]) ? hlsPlayer.levels[q].height + 'p' : 'Auto';
            html += '<div class="settings-item arrow" tabindex="0" data-page="quality"><span class="s-label">📊 Calidad</span><span class="s-value">' + qLabel + '</span></div>';
        }
        html += '<div class="settings-item arrow" tabindex="0" data-page="speed"><span class="s-label">⏩ Velocidad</span><span class="s-value">' + playbackRate + 'x</span></div>';
    } else if (menuPage === 'audio') {
        html += '<div class="settings-header back-header" tabindex="0" data-page="main">‹ 🔊 Audio</div>';
        availableAudio.forEach(function(a, i) {
            var sel = (i === currentAudioIdx);
            html += '<div class="settings-item' + (sel ? ' selected' : '') + '" tabindex="0" data-audio="' + i + '"><span class="s-label">' + a.label + '</span>' + (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
        });
    } else if (menuPage === 'subtitle') {
        html += '<div class="settings-header back-header" tabindex="0" data-page="main">‹ 💬 Subtítulos</div>';
        html += '<div class="settings-item' + (currentSubIdx === -1 ? ' selected' : '') + '" tabindex="0" data-sub="-1"><span class="s-label">Desactivados</span>' + (currentSubIdx === -1 ? '<span class="s-check">✓</span>' : '') + '</div>';
        availableSubs.forEach(function(s, i) {
            var sel = (i === currentSubIdx);
            html += '<div class="settings-item' + (sel ? ' selected' : '') + '" tabindex="0" data-sub="' + i + '"><span class="s-label">' + s.label + '</span>' + (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
        });
    } else if (menuPage === 'quality') {
        html += '<div class="settings-header back-header" tabindex="0" data-page="main">‹ 📊 Calidad</div>';
        if (hlsPlayer) {
            html += '<div class="settings-item' + (hlsPlayer.currentLevel === -1 ? ' selected' : '') + '" tabindex="0" data-q="-1"><span class="s-label">AUTO</span>' + (hlsPlayer.currentLevel === -1 ? '<span class="s-check">✓</span>' : '') + '</div>';
            (hlsPlayer.levels || []).forEach(function(l, i) {
                var sel = (i === hlsPlayer.currentLevel);
                html += '<div class="settings-item' + (sel ? ' selected' : '') + '" tabindex="0" data-q="' + i + '"><span class="s-label">' + l.height + 'p</span>' + (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
            });
        }
    } else if (menuPage === 'speed') {
        html += '<div class="settings-header back-header" tabindex="0" data-page="main">‹ ⏩ Velocidad</div>';
        SPEEDS.forEach(function(s) {
            var sel = (s === playbackRate);
            html += '<div class="settings-item' + (sel ? ' selected' : '') + '" tabindex="0" data-speed="' + s + '"><span class="s-label">' + s + 'x</span>' + (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
        });
    }
    settingsMenu.innerHTML = html;
    bindMenuEvents();
}

function bindMenuEvents() {
    settingsMenu.querySelectorAll('.back-header').forEach(function(el) {
        el.onclick = function(e) { e.stopPropagation(); menuPage = el.dataset.page; buildMenu(); };
    });
    settingsMenu.querySelectorAll('[data-page]').forEach(function(el) {
        if (!el.classList.contains('back-header'))
            el.onclick = function(e) { e.stopPropagation(); menuPage = el.dataset.page; buildMenu(); };
    });
    settingsMenu.querySelectorAll('[data-audio]').forEach(function(el) {
        el.onclick = function(e) { e.stopPropagation(); setAudioTrack(parseInt(el.dataset.audio)); };
    });
    settingsMenu.querySelectorAll('[data-sub]').forEach(function(el) {
        el.onclick = function(e) { e.stopPropagation(); setSubtitleTrack(parseInt(el.dataset.sub)); };
    });
    settingsMenu.querySelectorAll('[data-q]').forEach(function(el) {
        el.onclick = function(e) { e.stopPropagation(); if (hlsPlayer) { hlsPlayer.currentLevel = parseInt(el.dataset.q); menuPage = 'main'; buildMenu(); showToast('Calidad: ' + (parseInt(el.dataset.q) === -1 ? 'AUTO' : hlsPlayer.levels[parseInt(el.dataset.q)].height + 'p')); } };
    });
    settingsMenu.querySelectorAll('[data-speed]').forEach(function(el) {
        el.onclick = function(e) { e.stopPropagation(); playbackRate = parseFloat(el.dataset.speed); video.playbackRate = playbackRate; if (externalAudioEl) externalAudioEl.playbackRate = playbackRate; speedBtn.innerText = playbackRate + 'x'; menuPage = 'main'; buildMenu(); showToast('Velocidad: ' + playbackRate + 'x'); };
    });
}

settingsBtn.onclick = function(e) {
    e.stopPropagation(); menuPage = 'main';
    settingsContainer.classList.toggle('active');
    if (settingsContainer.classList.contains('active')) { detectAudioTracks(); detectSubtitleTracks(); buildMenu(); }
};
document.addEventListener('click', function(e) {
    if (!settingsContainer.contains(e.target)) settingsContainer.classList.remove('active');
    if (!volumeContainer.contains(e.target)) volumeContainer.classList.remove('active');
});

// ===== AUTO-OCULTAR CONTROLES =====
var hideTimer = null, mouseOverUI = false;
controls.addEventListener('mouseenter', function() { mouseOverUI = true; });
controls.addEventListener('mouseleave', function() { mouseOverUI = false; });

function showAllControls() {
    controls.classList.add("show");
    if (playbackStarted && video.paused && !video.ended) centerPlay.classList.add("visible");
    else centerPlay.classList.remove("visible");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
        if (!mouseOverUI && !video.paused && !isTV) {
            controls.classList.remove("show"); centerPlay.classList.remove("visible");
            settingsContainer.classList.remove('active'); volumeContainer.classList.remove('active');
        } else if (isTV && playbackStarted) {
            // En TV los controles se quedan visibles más tiempo
            hideTimer = setTimeout(function() {
                if (!video.paused) { controls.classList.remove("show"); centerPlay.classList.remove("visible"); }
            }, 5000);
        }
    }, 3000);
}

['mousemove','click','touchstart','keydown'].forEach(function(evt) {
    player.addEventListener(evt, showAllControls);
});

// ============================================================
// 🎮 SISTEMA D-PAD COMPLETO (Multi-plataforma)
// ============================================================

// Mapa universal de keycodes para TODAS las plataformas TV
var DPAD_KEYS = {
    // Estándar web
    'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
    'Enter': 'ok', ' ': 'ok', 'Escape': 'back', 'Backspace': 'back',
    // Android TV / Fire TV (keyCodes numéricos)
    19: 'up', 20: 'down', 21: 'left', 22: 'right',
    23: 'ok',    // DPAD_CENTER
    66: 'ok',    // ENTER
    4: 'back',   // BACK
    85: 'playpause', // MEDIA_PLAY_PAUSE
    89: 'rewind',    // MEDIA_REWIND
    90: 'fastforward', // MEDIA_FAST_FORWARD
    86: 'stop',      // MEDIA_STOP
    24: 'volup',     // VOLUME_UP
    25: 'voldown',   // VOLUME_DOWN
    164: 'mute',     // VOLUME_MUTE
    // Samsung Tizen
    10009: 'back',   // RETURN
    10182: 'back',   // EXIT
    10252: 'playpause',
    10232: 'rewind',
    10233: 'fastforward',
    // LG webOS
    461: 'back',     // BACK
    415: 'playpause',
    412: 'rewind',
    417: 'fastforward',
    413: 'stop'
};

function getDpadAction(e) {
    // Primero buscar por e.key
    if (e.key && DPAD_KEYS[e.key]) return DPAD_KEYS[e.key];
    // Luego por e.keyCode
    if (e.keyCode && DPAD_KEYS[e.keyCode]) return DPAD_KEYS[e.keyCode];
    return null;
}

// Navegación espacial entre botones de control en TV
var controlButtons = [];
function getControlButtons() {
    if (!controls.classList.contains('show')) return [];
    var btns = Array.from(controls.querySelectorAll('button, [tabindex="0"]'));
    return btns.filter(function(b) {
        return b.offsetParent !== null && getComputedStyle(b).display !== 'none';
    });
}

function findNextControl(direction) {
    var btns = getControlButtons();
    if (!btns.length) return null;
    var current = document.activeElement;
    var idx = btns.indexOf(current);
    if (idx === -1) return btns[0];

    if (direction === 'right') return btns[(idx + 1) % btns.length];
    if (direction === 'left') return btns[(idx - 1 + btns.length) % btns.length];

    // Arriba/Abajo: navegar en el menú de settings si está abierto
    if (settingsContainer.classList.contains('active')) {
        var items = Array.from(settingsMenu.querySelectorAll('[tabindex="0"]'));
        var curIdx = items.indexOf(current);
        if (curIdx !== -1) {
            if (direction === 'down') return items[(curIdx + 1) % items.length];
            if (direction === 'up') return items[(curIdx - 1 + items.length) % items.length];
        }
    }
    return null;
}

// Handler principal del D-PAD
document.addEventListener('keydown', function(e) {
    var action = getDpadAction(e);
    if (!action) return;

    // Si el overlay de entrada está visible, solo OK funciona
    if (overlay && overlay.style.display !== 'none') {
        if (action === 'ok') {
            e.preventDefault();
            document.getElementById('btn-entrar').click();
        }
        return;
    }

    // Si la publicidad está activa
    if (adBtn && adBtn.style.display !== 'none' && adBtn.classList.contains('ad-skippable')) {
        if (action === 'ok') {
            e.preventDefault();
            adBtn.click();
            return;
        }
    }

    // Si el menú de settings está abierto
    if (settingsContainer.classList.contains('active')) {
        if (action === 'back') {
            e.preventDefault();
            if (menuPage !== 'main') { menuPage = 'main'; buildMenu(); }
            else settingsContainer.classList.remove('active');
            return;
        }
        if (action === 'up' || action === 'down') {
            e.preventDefault();
            var next = findNextControl(action);
            if (next) next.focus();
            return;
        }
        if (action === 'ok') {
            e.preventDefault();
            var focused = document.activeElement;
            if (focused && focused.click) focused.click();
            return;
        }
    }

    // Si estamos en modo embed/drive (iframe), solo back funciona
    if (tipoCont === 'embed' || tipoCont === 'drive' || tipoCont === 'vacio') {
        if (action === 'back') {
            e.preventDefault();
            closePlayerAndReturn();
        }
        return;
    }

    // Controles de video directos
    e.preventDefault();

    switch(action) {
        case 'ok':
        case 'playpause':
            togglePlay();
            showAllControls();
            break;
        case 'left':
        case 'rewind':
            if (controls.classList.contains('show') && document.activeElement !== document.body) {
                var prev = findNextControl('left');
                if (prev) { prev.focus(); return; }
            }
            video.currentTime = Math.max(0, video.currentTime - 10);
            showToast('⏪ -10s');
            showAllControls();
            break;
        case 'right':
        case 'fastforward':
            if (controls.classList.contains('show') && document.activeElement !== document.body) {
                var nxt = findNextControl('right');
                if (nxt) { nxt.focus(); return; }
            }
            video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
            showToast('⏩ +10s');
            showAllControls();
            break;
        case 'up':
        case 'volup':
            if (controls.classList.contains('show')) {
                var upBtn = findNextControl('up');
                if (upBtn) { upBtn.focus(); return; }
            }
            var newUp = Math.min(1, Math.round((video.volume + 0.05) * 100) / 100);
            video.volume = newUp; video.muted = false; lastNonZeroVolume = newUp;
            if (externalAudioEl) { externalAudioEl.volume = newUp; externalAudioEl.muted = false; }
            syncVolumeVisuals(newUp, false);
            showToast('🔊 ' + Math.round(newUp * 100) + '%');
            showAllControls();
            break;
        case 'down':
        case 'voldown':
            if (controls.classList.contains('show')) {
                var downBtn = findNextControl('down');
                if (downBtn) { downBtn.focus(); return; }
            }
            var newDown = Math.max(0, Math.round((video.volume - 0.05) * 100) / 100);
            video.volume = newDown; video.muted = (newDown === 0);
            if (newDown > 0) lastNonZeroVolume = newDown;
            if (externalAudioEl) { externalAudioEl.volume = newDown; externalAudioEl.muted = (newDown === 0); }
            syncVolumeVisuals(newDown, newDown === 0);
            showToast(newDown === 0 ? '🔇 Silenciado' : '🔊 ' + Math.round(newDown * 100) + '%');
            showAllControls();
            break;
        case 'mute':
            muteBtn.click();
            showAllControls();
            break;
        case 'stop':
            video.pause();
            video.currentTime = 0;
            showAllControls();
            break;
        case 'back':
            if (settingsContainer.classList.contains('active')) {
                settingsContainer.classList.remove('active');
            } else if (volumeContainer.classList.contains('active')) {
                volumeContainer.classList.remove('active');
            } else {
                closePlayerAndReturn();
            }
            break;
    }
});

// ===== FUNCIÓN PARA CERRAR Y VOLVER =====
function closePlayerAndReturn() {
    // Intentar comunicar con la app padre (KikeFlix)
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'kikeflix-player-close' }, '*');
            return;
        }
    } catch(e) {}

    // Si no hay padre, intentar con Capacitor
    try {
        if (window.Capacitor) {
            window.Capacitor.Plugins.App.exitApp();
            return;
        }
    } catch(e) {}

    // Último recurso: cerrar ventana o ir atrás
    if (window.history.length > 1) window.history.back();
    else window.close();
}

btnBackTv.onclick = function() { closePlayerAndReturn(); };

// ============================================================
// 📨 POSTMESSAGE (Recibir teclas desde KikeFlix cuando está en iframe)
// ============================================================
window.addEventListener('message', function(e) {
    if (!e.data) return;

    // Recibir teclas D-PAD desde la app padre
    if (e.data.type === 'dpad-key') {
        var fakeEvent = { key: e.data.key, keyCode: e.data.keyCode, preventDefault: function(){} };
        var action = getDpadAction(fakeEvent);
        if (action) {
            var realEvent = new KeyboardEvent('keydown', { key: e.data.key, keyCode: e.data.keyCode });
            document.dispatchEvent(realEvent);
        }
        return;
    }

    // Comando directo de cerrar desde la app padre
    if (e.data.type === 'kikeflix-close-player') {
        closePlayerAndReturn();
        return;
    }

    // Comando para cargar nuevo video desde la app padre
    if (e.data.type === 'kikeflix-load-video' && e.data.url) {
        videoUrl = e.data.url;
        tipoCont = tipo(videoUrl);
        prepararPeliculaEnSegundoPlano();
        return;
    }
});

// Avisar a la app padre que el reproductor está listo
try {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'kikeflix-player-ready' }, '*');
    }
} catch(e) {}
// ============================================================
// CARGA Y PREPARACIÓN DEL CONTENIDO (DRIVE + MP4 + HLS + DASH + EMBED)
// ============================================================

function prepararPeliculaEnSegundoPlano() {
    playbackStarted = false;
    centerPlay.classList.remove("visible");
    wrapperExterno.style.display = 'none';

    // GOOGLE DRIVE
    if (tipoCont === "drive") {
        wrapperExterno.style.display = 'block';
        iframe.removeAttribute('sandbox');
        bloqueoFlecha.style.display = 'block';
        var driveUrl = videoUrl;
        if (driveUrl.includes("/view")) driveUrl = driveUrl.replace("/view", "/preview");
        iframe.src = driveUrl + (driveUrl.includes('?') ? '&' : '?') + 'autoplay=1';
        // En modo TV, mostrar controles básicos sobre el iframe
        if (isTV) {
            controls.style.display = 'block';
            playBtn.style.display = 'none';
            muteBtn.style.display = 'none';
            volumeContainer.style.display = 'none';
            speedBtn.style.display = 'none';
            pipBtn.style.display = 'none';
        }
        setTimeout(function() {
            blackScreen.classList.add('fade-out');
            setTimeout(function() {
                blackScreen.style.display = 'none';
                blackScreen.classList.remove('fade-out');
            }, 400);
        }, 1500);
    }
    // EMBED (otros iframes)
    else if (tipoCont === "embed") {
        wrapperExterno.style.display = 'block';
        iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin');
        iframe.src = videoUrl;
        if (isTV) {
            controls.style.display = 'block';
            playBtn.style.display = 'none';
            muteBtn.style.display = 'none';
            volumeContainer.style.display = 'none';
            speedBtn.style.display = 'none';
            pipBtn.style.display = 'none';
        }
        setTimeout(function() {
            blackScreen.classList.add('fade-out');
            setTimeout(function() {
                blackScreen.style.display = 'none';
                blackScreen.classList.remove('fade-out');
            }, 400);
        }, 1500);
    }
    // MP4 directo
    else if (tipoCont === "mp4") {
        video.style.display = 'block';
        video.src = videoUrl;
        video.load();
        detectAudioTracks();
        detectSubtitleTracks();
        parsedSubs.forEach(function(ps) { loadExternalSubtitleUrl(ps.url, ps.label); });
    }
    // HLS
    else if (tipoCont === "hls") {
        video.style.display = 'block';
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            hlsPlayer = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                startLevel: -1
            });
            hlsPlayer.loadSource(videoUrl);
            hlsPlayer.attachMedia(video);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                detectAudioTracks();
                detectSubtitleTracks();
                parsedSubs.forEach(function(ps) { loadExternalSubtitleUrl(ps.url, ps.label); });
            });
            hlsPlayer.on(Hls.Events.AUDIO_TRACKS_UPDATED, function() { detectAudioTracks(); buildMenu(); });
            hlsPlayer.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, function() { detectSubtitleTracks(); buildMenu(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoUrl;
            video.load();
            setTimeout(function() {
                detectAudioTracks(); detectSubtitleTracks();
                parsedSubs.forEach(function(ps) { loadExternalSubtitleUrl(ps.url, ps.label); });
            }, 2000);
        }
    }
    // DASH
    else if (tipoCont === "dash") {
        video.style.display = 'block';
        if (typeof dashjs !== 'undefined') {
            dashPlayer = dashjs.MediaPlayer().create();
            dashPlayer.initialize(video, videoUrl, false);
            dashPlayer.updateSettings({ streaming: { text: { defaultEnabled: true } } });
            setTimeout(function() {
                detectAudioTracks(); detectSubtitleTracks();
                parsedSubs.forEach(function(ps) { loadExternalSubtitleUrl(ps.url, ps.label); });
            }, 1500);
        }
    }
}

function iniciarPeliculaTransicionElegante() {
    blackScreen.style.display = 'block';
    videoIntro.classList.add('fade-out');

    setTimeout(function() {
        videoIntro.style.display = 'none';
        videoIntro.pause();

        if (tipoCont === 'mp4' || tipoCont === 'hls' || tipoCont === 'dash') {
            controls.style.display = 'block';
            video.play().catch(function(){});
            showAllControls();

            // En TV, enfocar el botón de play automáticamente
            if (isTV) {
                setTimeout(function() { playBtn.focus(); }, 300);
            }
        }
    }, 500);
}

// ============================================================
// INTRO OBLIGATORIA
// ============================================================

function iniciarSecuenciaIntro() {
    videoIntro.style.display = 'block';
    videoIntro.classList.remove('fade-out');
    videoIntro.currentTime = 0;

    var p = videoIntro.play();
    if (p !== undefined) {
        p.catch(function() {
            videoIntro.muted = true;
            videoIntro.play().catch(function() {
                iniciarPeliculaTransicionElegante();
            });
        });
    }

    prepararPeliculaEnSegundoPlano();

    videoIntro.ontimeupdate = function() {
        if (videoIntro.duration && (videoIntro.duration - videoIntro.currentTime) <= 0.6) {
            if (!videoIntro.dataset.fading) {
                videoIntro.dataset.fading = "true";
                videoIntro.classList.add('fade-out');
            }
        }
    };

    videoIntro.onended = function() {
        iniciarPeliculaTransicionElegante();
    };
}

// ============================================================
// OVERLAY ENTRADA + PUBLICIDAD
// ============================================================

document.getElementById('btn-entrar').onclick = function() {
    overlay.style.display = 'none';
    if (!videoUrl) return;

    if (adUrl) {
        wrapperExterno.style.display = 'block';
        iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin');
        iframe.src = adUrl.includes('?') ? adUrl + '&autoplay=1' : adUrl + '?autoplay=1';

        adBtn.style.display = 'inline-flex';
        adBtn.className = 'ad-counting';
        var timeLeft = 21;
        adText.textContent = 'Publicidad · ' + timeLeft + 's';

        var countdown = setInterval(function() {
            timeLeft--;
            if (timeLeft > 15) {
                adBtn.className = 'ad-counting';
                adText.textContent = 'Publicidad · ' + timeLeft + 's';
            } else {
                adBtn.className = 'ad-skippable';
                adText.innerHTML = 'Saltar Anuncio ⏭';
                // En TV, enfocar el botón de saltar automáticamente
                if (isTV) adBtn.focus();
            }
            if (timeLeft <= 0) {
                clearInterval(countdown);
                adBtn.style.display = 'none';
                iniciarSecuenciaIntro();
            }
        }, 1000);

        adBtn.onclick = function() {
            if (timeLeft <= 15) {
                clearInterval(countdown);
                adBtn.style.display = 'none';
                iniciarSecuenciaIntro();
            }
        };
    } else {
        iniciarSecuenciaIntro();
    }
};

// En TV, enfocar el botón de entrada automáticamente
if (isTV) {
    setTimeout(function() {
        var btnEntrar = document.getElementById('btn-entrar');
        if (btnEntrar) btnEntrar.focus();
    }, 500);
}

syncVolumeVisuals(video.volume, video.muted);
